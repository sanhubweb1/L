<h2>Upcoming payments</h2><div class="c">${up.slice(0,4).map(l=>{const d=days(l);return `<div class="row"><span class="r" style="justify-content:flex-start"><span class="dot" style="background:${clr(d)}"></span><span><b>${l.lender}</b><br><span class="mu" style="color:${clr(d)}">${when(d)} · ${fd(nxt(l))}</span></span></span><span class="r"><b>${inr(l.emi)}</b><button class="pri" data-a="pay" data-id="${l.id}">Paid</button></span></div>`}).join('')||'<div class="row mu">Koi active loan nahi</div>'}</div>
${fxcard()}${hind()}${dhome()}<button class="pri" onclick="go('loans')" style="width:100%;padding:13px;margin-bottom:8px">Open all loans</button>`}

/* Pie dashboard */
const PAL=['#6366f1','#22a559','#f08a00','#e5362b','#0ea5e9','#a855f7','#14b8a6','#94a3b8'];
function pie(S,ct){S=S.filter(x=>x.v>0);const t=sum(S,x=>x.v);if(!t)return '<div class="mu" style="margin:auto">No data</div>';let c=0;
return `<svg viewBox="0 0 36 36" class="pz"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="#f1f3f6" stroke-width="5"/>${S.map(x=>{const p=x.v/t*100,o=25-c;c+=p;return `<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${x.c}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"/>`}).join('')}${ct?`<text x="18" y="19.6" text-anchor="middle" font-size="5" font-weight="700" fill="#111418">${ct}</text>`:''}</svg><div class="lgd">${S.slice(0,3).map(x=>`<span><i style="background:${x.c}"></i>${x.n} ${Math.round(x.v/t*100)}%</span>`).join('')}</div>`}
const sq=(t,b)=>`<div class="sq"><b>${t}</b>${b}</div>`;
function pies(A,T,out,pd,pc,mo,inc){const P=sum(L,l=>+l.principal||0),ip=sum(L,l=>+an(l).ip||0),il=sum(A,l=>Math.max(0,+an(l).il||0)),
by=f=>{const a=A.slice().sort((x,y)=>f(y)-f(x)),r=a.slice(0,5).map((l,i)=>({v:f(l),c:PAL[i],n:l.lender.split(' ')[0]})),o=sum(a.slice(5),f);if(o>0)r.push({v:o,c:PAL[7],n:'Others'});return r},
dd=A.map(l=>({d:days(l),a:l.emi})),ds=g=>sum(dd.filter(g),x=>x.a);
return [sq('Paid vs remaining',pie([{v:pd,c:PAL[1],n:'Paid'},{v:out,c:PAL[3],n:'Left'}],Math.round(pc)+'%')),
sq('Principal vs interest',pie([{v:P,c:PAL[0],n:'Principal'},{v:Math.max(0,T-P),c:PAL[2],n:'Interest'}])),
sq('Remaining by lender',pie(by(left))),
sq('Monthly EMI share',pie(by(l=>l.emi),inr(mo).replace('₹','₹'))),
sq('Interest paid vs left',pie([{v:ip,c:PAL[3],n:'Paid'},{v:il,c:PAL[2],n:'Left'}])),
sq('EMI vs income',inc?pie([{v:mo,c:PAL[3],n:'EMI'},{v:Math.max(inc-mo,0),c:PAL[1],n:'Free'}],Math.round(mo/inc*100)+'%'):'<div class="mu" style="margin:auto;text-align:center">Settings me<br>income daalo</div>'),
sq('Active vs closed',pie([{v:A.length,c:PAL[0],n:'Active'},{v:L.length-A.length,c:PAL[1],n:'Closed'}],A.length+'/'+L.length)),
sq('Due timing',pie([{v:ds(x=>x.d<0),c:PAL[3],n:'Overdue'},{v:ds(x=>x.d>=0&&x.d<=7),c:PAL[2],n:'This week'},{v:ds(x=>x.d>7),c:PAL[0],n:'Later'}]))].join('')}
render();

/* Persisted view mode; laptop/desktop automatically uses full-width workspace. */
(function(){
 const root=document.documentElement, key='loantracker_view_mode';
 function setView(mode){
  mode=(mode==='classic'?'classic':'modern');
  root.dataset.viewMode=mode;
  try{localStorage.setItem(key,mode)}catch(e){}
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===mode));
 }
 let saved='modern';try{saved=localStorage.getItem(key)||'modern'}catch(e){}
 setView(saved);
 document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
 const hint=document.getElementById('desktopHint');
 function fitHint(){if(hint)hint.textContent=window.matchMedia('(min-width: 900px)').matches?'Desktop workspace · full-width fit':'Mobile layout · responsive';}
 fitHint();window.addEventListener('resize',fitHint,{passive:true});
})();
</script></body></html>
